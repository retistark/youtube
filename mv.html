<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가게 뮤비 무한재생</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font:18px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow:hidden}
#player{position:fixed;inset:0;width:100%;height:100%}
#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:10;padding:24px}
.box{width:min(640px,100%);display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 6px;font-size:32px}
input{width:100%;font-size:18px;padding:14px;border-radius:10px;border:2px solid #444;background:#222;color:#fff}
input:focus,button:focus{outline:3px solid #ffd54a}
label{display:flex;gap:10px;align-items:center;font-size:18px}
label input{width:26px;height:26px}
button{font-size:22px;padding:16px;border:0;border-radius:12px;background:#e53935;color:#fff;font-weight:700;cursor:pointer}
.hint{color:#aaa;font-size:15px;margin:0}
#err{color:#ff8a80;min-height:1.5em;margin:0}
#bar{position:fixed;right:16px;bottom:16px;z-index:5;display:flex;gap:8px;opacity:0;transition:opacity .3s}
body:hover #bar{opacity:1}
#bar button{font-size:15px;padding:10px 14px;background:rgba(0,0,0,.7)}
#status{position:fixed;left:16px;bottom:16px;z-index:5;font-size:14px;color:#ccc;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .3s}
body:hover #status{opacity:1}
body.playing{cursor:none}
body.playing:hover{cursor:default}
</style>
</head>
<body>
<div id="player"></div>

<div id="setup">
  <div class="box">
    <h1>가게 뮤비 무한재생</h1>
    <p class="hint">유튜브 재생목록 링크를 붙여넣고 시작을 누르세요. 한 번 넣으면 다음부터는 기억해요.</p>
    <input id="url" placeholder="https://youtube.com/playlist?list=..." autocomplete="off">
    <label><input type="checkbox" id="shuffle"> 섞어서 재생 (셔플)</label>
    <label><input type="checkbox" id="autostart"> 다음에 열면 바로 시작 (소리 없이 시작될 수 있음)</label>
    <p id="err"></p>
    <button id="start">▶ 시작</button>
    <p class="hint">한 바퀴 다 돌면 재생목록을 새로 불러와서, 그사이 추가한 곡도 다음 바퀴부터 나와요. 재생 안 되는 영상은 자동으로 건너뛰어요.</p>
  </div>
</div>

<div id="status"></div>
<div id="bar">
  <button id="btnNext">다음 곡</button>
  <button id="btnFull">전체화면</button>
  <button id="btnSetup">설정</button>
</div>

<script>
{
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

// 재생목록 ID 뽑기 (링크든 ID든 다 받기)
function parseList(s){
  s = (s||'').trim();
  const m = s.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{10,}$/.test(s)) return s;
  return null;
}

const qs = new URLSearchParams(location.search);
const DEFAULT_LIST = 'PLKiYNMwxXPAc'; // 가게 재생목록 "신의주"
let listId = parseList(qs.get('list') || store.get('mv_list') || DEFAULT_LIST);
$('url').value = store.get('mv_url') || (listId ? 'https://www.youtube.com/playlist?list=' + listId : '');
$('shuffle').checked = store.get('mv_shuffle') === '1';
$('autostart').checked = store.get('mv_autostart') === '1';

let player = null, apiReady = false, started = false;
let lastGood = Date.now();   // 마지막으로 정상 재생된 시각
let loops = 0;

function status(t){ $('status').textContent = t; }

// 유튜브 API 불러오기
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  apiReady = true;
  if (store.get('mv_autostart') === '1' && listId) start();
};

function loadList(){
  // 매번 새로 불러와서 재생목록에 추가된 곡까지 반영
  player.loadPlaylist({ list: listId, listType: 'playlist', index: 0 });
  if ($('shuffle').checked) {
    setTimeout(() => { try{ player.setShuffle(true); player.playVideoAt(0); }catch(e){} }, 1500);
  }
}

function restartLoop(){
  loops++;
  status('처음부터 다시 (' + loops + '바퀴째)');
  loadList();
}

function isLast(){
  try{
    const pl = player.getPlaylist() || [];
    return pl.length > 0 && player.getPlaylistIndex() >= pl.length - 1;
  }catch(e){ return false }
}

function next(){
  if (isLast()) restartLoop();
  else { try{ player.nextVideo() }catch(e){ restartLoop() } }
}

function start(){
  const id = parseList($('url').value) || listId;
  if (!id){ $('err').textContent = '재생목록 링크를 확인해 주세요. (list= 가 들어있는 주소)'; return; }
  if (!apiReady){ $('err').textContent = '유튜브 불러오는 중… 잠시 후 다시 눌러주세요.'; return; }
  listId = id;
  store.set('mv_list', id);
  store.set('mv_url', $('url').value.trim());
  store.set('mv_shuffle', $('shuffle').checked ? '1' : '0');
  store.set('mv_autostart', $('autostart').checked ? '1' : '0');
  $('setup').style.display = 'none';
  document.body.classList.add('playing');
  lastGood = Date.now();

  if (player){ loadList(); return; }
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { listType: 'playlist', list: listId, autoplay: 1, controls: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: e => {
        started = true;
        e.target.playVideo();
        if ($('shuffle').checked) setTimeout(() => { try{ player.setShuffle(true); player.playVideoAt(0); }catch(e){} }, 1500);
      },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING){
          lastGood = Date.now();
          try{
            const pl = player.getPlaylist() || [];
            status((player.getPlaylistIndex()+1) + ' / ' + pl.length + '곡');
          }catch(_){}
        }
        // 마지막 곡이 끝나면 재생목록을 새로 불러와 1번부터
        if (e.data === YT.PlayerState.ENDED){
          if (isLast()) restartLoop();
          else setTimeout(() => { if (player.getPlayerState() === YT.PlayerState.ENDED) next(); }, 3000);
        }
      },
      onError: e => {
        // 삭제/퍼가기 금지/지역 제한 영상은 건너뛰기
        status('재생 불가 영상 건너뜀 (오류 ' + e.data + ')');
        setTimeout(next, 1500);
      }
    }
  });
}

// 감시: 40초 넘게 재생이 안 되고 있으면 다음 곡으로, 계속 안 되면 처음부터
let stuckCount = 0;
setInterval(() => {
  if (!started || !player || !player.getPlayerState) return;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING){ lastGood = Date.now(); stuckCount = 0; return; }
  if (st === YT.PlayerState.PAUSED) return; // 직접 멈춘 건 건드리지 않음
  if (Date.now() - lastGood > 40000){
    stuckCount++;
    lastGood = Date.now();
    if (stuckCount >= 3){ stuckCount = 0; restartLoop(); }
    else next();
  }
}, 5000);

// 하루에 한 번(새벽 5시쯤) 페이지 새로고침해서 브라우저 메모리 정리
setInterval(() => {
  const d = new Date();
  if (started && d.getHours() === 5 && d.getMinutes() === 0){
    store.set('mv_autostart_once', '1');
    location.reload();
  }
}, 60000);
if (!$('url').value) $('url').value = 'https://www.youtube.com/playlist?list=' + DEFAULT_LIST;
if (store.get('mv_autostart_once') === '1'){
  store.set('mv_autostart_once', '0');
  window.onYouTubeIframeAPIReady = () => { apiReady = true; if (listId) start(); };
}

$('start').addEventListener('click', start);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('btnNext').addEventListener('click', next);
$('btnSetup').addEventListener('click', () => { $('setup').style.display = 'flex'; document.body.classList.remove('playing'); });
$('btnFull').addEventListener('click', () => {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
});
}
</script>
</body>
</html>
